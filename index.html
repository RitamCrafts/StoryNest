<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>StoryNest — Write. Share. Discover.</title>

    <meta
      name="description"
      content="StoryNest is a place to write, share, and discover stories."
    />

    <meta
      name="keywords"
      content="StoryNest, stories, blogging, writing, blogs, reading, community"
    />

    <meta name="author" content="StoryNest" />
    <meta name="robots" content="index, follow" />

    <!-- Theme / Browser UI -->
    <meta name="theme-color" content="#008f3d" />
    <meta name="color-scheme" content="light" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://story-nest-zone.vercel.app/"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="StoryNest — Write. Share. Discover."
    />
    <meta
      property="og:description"
      content="A place to write, share, and discover stories."
    />
    <meta
      property="og:url"
      content="https://story-nest-zone.vercel.app/"
    />
    <meta property="og:site_name" content="StoryNest" />

    <meta
      property="og:image"
      content="https://story-nest-zone.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="StoryNest" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="StoryNest — Write. Share. Discover."
    />
    <meta
      name="twitter:description"
      content="A place to write, share, and discover stories."
    />
    <meta
      name="twitter:image"
      content="https://story-nest-zone.vercel.app/og-image.png"
    />

    <!-- Mobile / PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta name="apple-mobile-web-app-title" content="StoryNest" />

    <!-- Security / Referrer -->
    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
